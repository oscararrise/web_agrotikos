{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgroTikos | Tecnología inteligente para el campo{% endblock %}</title>
  <meta name="description" content="AgroTikos conecta conocimiento de campo, sensores, datos, automatización e inteligencia para apoyar mejores decisiones productivas.">
  <meta name="theme-color" content="#07110d">
  <link rel="canonical" href="https://agrotikos.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AgroTikos | Tecnología inteligente para el campo">
  <meta property="og:description" content="Tecnología práctica para observar, entender y mejorar sistemas productivos agropecuarios.">
  <meta property="og:url" content="https://agrotikos.com/">
  <meta property="og:site_name" content="AgroTikos">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AgroTikos | Tecnología inteligente para el campo">
  <meta name="twitter:description" content="Sensores, datos, automatización e inteligencia aplicados al campo real.">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  {% block extra_head %}{% endblock %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AgroTikos",
    "url": "https://agrotikos.com",
    "email": "info@agrotikos.com",
    "description": "Empresa colombiana de tecnología aplicada al sector agropecuario.",
    "areaServed": "CO"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__network">
      <span></span><span></span><span></span><span></span>
      <svg viewBox="0 0 160 80" role="presentation"><path d="M20 40 L58 18 L96 48 L140 24"/></svg>
    </div>
    <strong>AGROTIKOS</strong>
  </div>

  <header class="site-header" id="siteHeader">
    <a class="brand brand--official" href="#inicio" aria-label="AgroTikos, inicio">
      <img src="{% static 'img/agrotikos-logo.png' %}" alt="AgroTikos Technology">
    </a>

    <nav class="desktop-nav desktop-nav--primary" aria-label="Navegación principal">
      <a class="nav-top-btn is-active" href="#inicio">Inicio</a>
      <button class="nav-top-btn nav-top-btn--future" type="button" title="Servicios: próximamente">Servicios <span>PRÓXIMAMENTE</span></button>
    </nav>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span></button>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <nav aria-label="Navegación móvil">
      <a href="#inicio"><span>01</span> Inicio</a>
      <button class="mobile-service-future" type="button"><span>02</span> Servicios <small>PRÓXIMAMENTE</small></button>
    </nav>
  </div>

  <main id="contenido">{% block content %}{% endblock %}</main>

  <footer class="site-footer site-footer--minimal">
    <a class="footer-official-logo" href="#inicio" aria-label="AgroTikos">
      <img src="{% static 'img/agrotikos-logo.png' %}" alt="AgroTikos Technology">
    </a>
    <p>Tecnología inteligente para el campo.</p>
    <div class="footer-meta">
      <span>Colombia · LatAm</span>
      <span>© {% now "Y" %} AgroTikos</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js" defer></script>
  <script src="{% static 'js/dimitra.js' %}" defer></script>
  <script src="{% static 'js/animations.js' %}" defer></script>
  <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
